<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 150px;
      height: 150px;
      background: #3498db;
      position: relative;
      animation: move 2s infinite alternate;
    }

    @keyframes move {
      from {
        left: 0;
        border-radius: 0;
      }
      to {
        left: 400px;
        border-radius: 50%;
        background-color: red;
      }
    }
  </style>
</head>
<body>

  <div class="box"></div><br/>
  <div class="box"></div><br>
  <div class="box"></div><br>
  <div class="box"></div>

</body>
</html>
