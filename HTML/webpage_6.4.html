<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scroll Background Change with DIV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
     
    }
    body {
      font-family: Arial, sans-serif;
      color: white;
    }

    .section {
      height: 800px;
      background-size: cover;
      background-position: center;
      background-attachment: fixed; 
      text-align: center;
      
    }

    .bg1 {
      background-image: url('/Coffee_img/1158153.jpg');
      color: yellow;
    }

    .bg2 {
      background-image: url('/Coffee_img/1697082.jpg');
    }

    .bg3 {
      background-image: url('/Coffee_img/2402088.jpg');
    }

    .bg4 {
      background-image: url('/Coffee_img/2632469.jpg');
    }

    .content {
      /* background: rgba(255, 255, 255, 0.399); */
      padding: 50px;
      border-radius: 50px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
    }
    .navbar{
      background-color: #c9bfbf;
     justify-content: center;
     padding: 5px;
     position: fixed;
     width: 100%;
     display: flex;
      gap: 50px;
     
    }
    .navbar a{
      text-decoration: none;
      
    }
    .navbar a:hover{
      background-color: aqua;
    }
   .ko1 {
    height:250px;
    width: 350px;
    margin-top: 50px;
    margin-left: 50px;
    background-image: url('/Coffee_img/2632548.jpg');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
   }
  .ko1:hover {
    border-radius: 50px;
    border: 2px dotted rgb(228, 228, 228);
    /* background-color: aqua; */
    /* background-image: url(/pexels-pixabay-33045.jpg); */
  
  }
  .cardesign{
    display: flex;
    gap: 50px;
    padding: 30px;
    border: 2px double rgb(228, 228, 228);
  }

  .videocode1{
    display: flex;
  }
  
  .a1{
    width: 200px;
    height: 200px;
    background-image: url('/Coffee_img/2632660.jpg');
    margin: 70px;
    animation: move 4s alternate infinite;
    background-position: center;
    background-size: cover;
  }
  .a1:hover{
    background-image: url('/Coffee_img/773817.jpg');
    border: 2px dotted rgb(251, 207, 13);
    background-position: center;
    background-size: cover;
    border-radius: 50%;
  }
  @keyframes move{
    from{
      background-image: url('/Coffee_img/2390014.jpg');
    }
    to{
      background-image: url('/Coffee_img/2632489.jpg');
    }
  }
  .r4 {
    width: 660px;
    height: 440px;
    margin-top: 80px;
    margin-left: 470px;
}
  .hover-video {
      width: 100%;
      height: 100%;
    }

</style>
</head>
<body>
  <div class="navbar">
      <a href="HTTPS">Home</a>
      <a href="#">About</a>
      <a href="#">Gallery</a>
      <a href="#">Contact</a> 
</div>
  <div class="section bg1">
    
    <div class="content">
      
      <h1>Hello</h1>
      <p>This is Section 1</p>
    </div>

    <div class="cardesign">

      <div class="ko1" style="background-image: url(/Coffee_img/2632548.jpg)">
       <!-- image for car -->
      </div>
      <div class="ko1" style="background-image: url('/Coffee_img/2632574.jpg');">
       <!-- image for car -->
      </div>
      <div class="ko1" style="background-image: url('/Coffee_img/2632595.jpg');">
      </div>
    </div>
      

  </div>

  <div class="section bg2">
    
    <div class="content">
      <h1>Mountains</h1>
      <p>This is Section 2</p>
    </div>
        <div class="videocode1">
            <div class="a1"></div>
            <div class="r4">
                <video class="hover-video" muted autoplay loop>
                <source src="/Coffee_video/2853793-uhd_3840_2160_24fps.mp4" type="video/mp4">
            </video>
            </div>
        </div>
  </div>

  <div class="section bg3">
    <div class="content">
      <h1>Forest</h1>
      <p>This is Section 3</p>
    </div>
  </div>

  <div class="section bg4" id="Home">
    <div class="content">
      <h1>Desert</h1>
      <p>This is Section 4</p>
      <video class="bstec" muted autoplay loop>
        <source src="/Coffee_video//4281782-hd_1080_1920_25fps.mp4" type="video/mp4">
      </video>
    </div>
  </div>

</body>
</html>
