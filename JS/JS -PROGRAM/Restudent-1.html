<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Food Menu</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff8f0;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #d35400;
    }

    .menu {
      display: inline-block;
      margin-top: 30px;
      text-align: left;
      background-color: #fff3e0;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    .menu-item {
      margin: 15px 0;
      font-size: 18px;
    }

    .menu-item button {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    .menu-item button:hover {
      background-color: #d35400;
    }

    .output {
      margin-top: 30px;
      font-size: 20px;
      color: #444;
    }
  </style>
</head>
<body>

  <h1>📋 Student Canteen Menu</h1>

  <div class="menu">
    <div class="menu-item">
      1. Chole Bhature - ₹150
      <button onclick="order('Chole Bhature', 150)">Order</button>
    </div>
    <div class="menu-item">
      2. Kachori (2 pcs) - ₹90
      <button onclick="order('Kachori (2 pcs)', 90)">Order</button>
    </div>
    <div class="menu-item">
      3. Samosa (1 pc) - ₹20
      <button onclick="order('Samosa', 20)">Order</button>
    </div>
    <div class="menu-item">
      4. Masala Dosa - ₹100
      <button onclick="order('Masala Dosa', 100)">Order</button>
    </div>
    <div class="menu-item">
      5. Cold Drink - ₹40
      <button onclick="order('Cold Drink', 40)">Order</button>
    </div>
  </div>

  <div class="output" id="output"></div>

  <script>
    function order(item, price) {
      document.getElementById('output').innerText = `You ordered: ${item} | Total: ₹${price}`;
    }
  </script>

</body>
</html>
