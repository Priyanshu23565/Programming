<!DOCTYPE html>
<html>
<head>
  <title>Simple API Example</title>
</head>
<body>

<h1>Wikipedia Data Fetch </h1>
<input type="text" id="ko">

<button onclick="getJoke()">Click </button>

<p id="joke"></p>

<script>
  function getJoke() {
      let c=document.getElementById('ko').value;
      
    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${c}`)

      .then(response => response.json())
      .then(data => {
       
          document.getElementById('joke').innerText = data.extract ||"no";
        })
      .catch(error => {
          document.getElementById('joke').innerText = "Error fetching joke.";
          
        });
    }
</script>

</body>
</html>
