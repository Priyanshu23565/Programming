<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Awesome Icons</title>
  <!-- Font Awesome CDN -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-...your-integrity-here..."
   
  />

  <style>
    .icon {
      font-size: 40px;
      color: #00bcd4;
      margin: 20px;
      transition: 0.3s;
    }

    .icon:hover {
      color: #7fff00;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <!-- Icons -->
<i class="fas fa-headphones icon"></i>
<i class="fas fa-camera icon"></i>

 <i class="fa-solid fa-face-smile icon"></i>

   
  <i class="fas fa-home icon" title="Home"></i>
  <i class="fas fa-search icon" title="Search"></i>
  <i class="fas fa-cog icon" title="Settings"></i>

</body>
</html>
