<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: flex;
      gap: 20px;
      margin: 50px;
    }

    .box {
      width: 100px;
      height: 100px;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.4s ease;
      border-radius: 10px;
      user-select: none;
    }

    /* Scale */
    .scale-box {
      background-color: #4CAF50;
    }
    .scale-box:hover {
      transform: scale(1.3);
    }

    /* Rotate */
    .rotate-box {
      background-color: #2196F3;
    }
    .rotate-box:hover {
      transform: rotate(45deg);
    }

    /* Translate */
    .translate-box {
      background-color: #FF5722;
    }
    .translate-box:hover {
      transform: translate(50px, 20px);
    }

    /* Skew */
    .skew-box {
      background-color: #9C27B0;
    }
    .skew-box:hover {
      transform: skew(20deg, 10deg);
    }

    /* Matrix */
    .matrix-box {
      background-color: #FF9800;
    }
    .matrix-box:hover {
      transform: matrix(1, 0.3, 0.3, 1, 30, 10);
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="box scale-box">Scale</div>
    <div class="box rotate-box">Rotate</div>
    <div class="box translate-box">Translate</div>
    <div class="box skew-box">Skew</div>
    <div class="box matrix-box">Matrix</div>
  </div>

</body>
</html>
