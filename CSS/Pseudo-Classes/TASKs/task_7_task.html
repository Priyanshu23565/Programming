<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple 3 Boxes</title>
  <style>
    body {
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 50px;
      background: #f5f5f5;
    }
    .box {
      width: 150px;
      height: 150px;
      /* background: white; */
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease;
      cursor: pointer;
      background-size: cover; background-position: center;
    }
    .box:hover {
      transform: translateY(-10px);
    }
    .box:nth-child(3){
        background-color: aqua;
    }
    .box:hover:nth-child(3){
        background-color: rgb(103, 217, 162);
        border-radius: 50px;
        transform: scale(0.8);
        transition: 5s;
        box-shadow: 21px 3px 12px  rgb(168, 234, 16) ;
        border: 5px dotted rebeccapurple;
    }
    .box:nth-child(4){
        background-color: aqua;
    }
    .box:hover:nth-child(4){
        background-color: bisque;
        border-radius: 50px;
        transform: scale(0.8);
        transition: all 3s;
        box-shadow: 21px 3px 12px  red ;
    }
  </style>
</head>
<body>

  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
  <div class="box" style="background-image: url('/Car_game_1212.png');">Box 3</div>
  <div class="box" style="background-image: url('/Car_game_1212.png'); ">Box 3</div>

</body>
</html>
