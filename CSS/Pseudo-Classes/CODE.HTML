<!DOCTYPE html>
<html>
<head>
  <title>Animated Navbar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    nav {
      background-color: #333;
      padding: 15px 30px;
      display: flex;
      justify-content: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      position: relative;
      padding: 5px 0;
      transition: color 0.3s ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0%;
      height: 3px;
      background: #00ffff;
      transition: width 0.4s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    nav a:hover {
      color: #00ffff;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </nav>

</body>
</html>
