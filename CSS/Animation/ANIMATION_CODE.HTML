<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transform Hover Animations</title>
<style>
  body {
    background: #121212;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    display: flex;
    gap: 25px;
    padding: 20px;
    background: #1e1e1e;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.8);
  }

  .box {
    width: 120px;
    height: 120px;
    color: #fff;
    font-weight: 600;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 15px;
    user-select: none;
    box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    transition: transform 0.5s cubic-bezier(0.42, 0, 0.58, 1);
  }

  /* Background gradients */
  .scale-box {
    background: linear-gradient(135deg, #43cea2, #185a9d);
  }
  .rotate-box {
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .translate-box {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #222;
  }
  .skew-box {
    background: linear-gradient(135deg, #f953c6, #b91d73);
  }
  .matrix-box {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
  }

  /* Hover transforms */
  .scale-box:hover {
    transform: scale(1.3);
  }
  .rotate-box:hover {
    transform: rotate(45deg);
  }
  .translate-box:hover {
    transform: translate(50px, 20px);
  }
  .skew-box:hover {
    transform: skew(20deg, 10deg);
  }
  .matrix-box:hover {
    transform: matrix(1, 0.3, 0.3, 1, 30, 10);
  }
</style>
</head>
<body>

  <div class="container">
    <div class="box scale-box">Scale</div>
    <div class="box rotate-box">Rotate</div>
    <div class="box translate-box">Translate</div>
    <div class="box skew-box">Skew</div>
    <div class="box matrix-box">Matrix</div>
  </div>

</body>
</html>
