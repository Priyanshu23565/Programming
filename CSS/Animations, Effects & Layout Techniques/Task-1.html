<style>
  #code {
    height: 200px;
    width: 500px;
    display: flex;
    background-color: blue;
  }
  .box{
    margin: 30px;
    height: 150px;
    width: 200px;
  
    border: 2px solid black;
  }
  .red{
    background-color: red;
  }
  .red:hover{
    border-radius: 50%;
    border: 2px dotted yellow;
    transition: 2s;
    transform: scale(1.2);
  }

  .green{
    background-color: green;
    
  }
  .green:hover{
    border-radius: 50%;
    border: 2px dotted yellow;
    transition: 2s;
    /* transform: scale(-1.3); */
    background-color: green;
    box-shadow: 5px 5px 20px red,
    -5px -10px 5px;
  }

  .yellow {
    background-color: yellow;
  }
</style>

<body>
  <div id="code">
    <div class="box red"></div>
    <div class="box green"></div>
    <div class="box yellow"></div>
  </div>
</body>
