<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flip Example</title>
  <style>
    #container {
      height: 250px;
      width: 250px;
      perspective: 1000px;
    }

    #fliper {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1.6s;
    }

    #container:hover #fliper {
        transform: rotateY(180deg);
      transform: rotateY(190deg);
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; /* visible Try kro */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      border: 12px dotted red;
    }

    .front {
      background-color: aqua;
    }

    .back {
      background-color: yellow;
      transform: rotateY(180deg) ;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="fliper">
      <div class="front">123456789</div>
      <div class="back">Hello World 😊</div>
    </div>
  </div>
</body>
</html>
