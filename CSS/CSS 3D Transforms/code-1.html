<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #container {
        height: 250px;
        width: 250px;
        background-color: aqua;
        transition: 0.6s;
        transform: rotate(0deg);
    }
    #container:hover{
        background-color: yellow;
        transform: rotate(180deg);
        border: 2px dotted red;
        border-radius: 50px;
       
    }
</style>
<body>
    <div id="container">
        234567890
    </div>
</body>
</html>
