<style>
  .egg-gradient {
    height: 150px;
    background: radial-gradient(ellipse, #f00, #fff);
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    transition: transform 0.3s ease;
    border-radius: 20px; /* optional for smoother edges */
    cursor: pointer;
  }

  .egg-gradient:hover {
    transform: scale(1.1);
    background: radial-gradient( #f00, #fff);
  }
</style>

<div class="egg-gradient">
  🥚 Egg Shape Gradient
</div>
